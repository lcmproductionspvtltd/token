<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eef8"/>
      <stop offset=".55" stop-color="#e6ddf0"/>
      <stop offset="1" stop-color="#d9cbe8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".15" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8a6fa8" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- a soft queue of token tickets -->
  <g fill="#ffffff" fill-opacity=".55" stroke="#8a6fa8" stroke-opacity=".18" stroke-width="2">
    <rect x="470" y="520" width="250" height="120" rx="22" transform="rotate(-8 595 580)"/>
    <rect x="520" y="660" width="220" height="104" rx="20" transform="rotate(5 630 712)"/>
    <rect x="60" y="760" width="200" height="96" rx="18" transform="rotate(-4 160 808)"/>
  </g>
  <circle cx="660" cy="180" r="140" fill="#b79bd3" fill-opacity=".18"/>
  <circle cx="120" cy="420" r="90" fill="#b79bd3" fill-opacity=".12"/>
</svg>
