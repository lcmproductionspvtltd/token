# Runs on every push and pull request. Render deploys only after these pass
# (render.yaml: autoDeployTrigger: checksPass – "After CI Checks Pass" in the Render dashboard).
#   server-and-web  syntax, secret scan, dependency audit, web bundle up to date, all server tests
#   apps            Flutter analyze + tests for BQuee Biz, BQuee (customer) and the shared code
#   android-release release APK + App Bundle of both apps compile (test key; store signing is release.yml)
#   ios-release     iPhone release build of both apps compiles on macOS (no signing)
# Versions are fixed: actions by commit, Flutter by FLUTTER_VERSION – update them on purpose, not by surprise.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bquee
          POSTGRES_PASSWORD: bquee
          POSTGRES_DB: bquee_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bquee"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://bquee:bquee@localhost:5432/bquee_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          for f in $(git ls-files 'server.js' 'src/*.js' 'scripts/*.js' 'tests/*.js'); do node --check "$f"; done

      - name: No secrets committed
        run: bash scripts/check-secrets.sh

      - name: Install web build tools (exactly as package-lock.json lists)
        run: npm ci --no-fund

      - name: Known security problems in packages
        run: npm audit --audit-level=high

      - name: Web bundle matches the source
        run: |
          npm run build
          git diff --stat --exit-code public/app || (echo "public/app is out of date – run npm run build and commit it" && exit 1)

      - name: Server tests (API, security, sign-in, database client, concurrency…)
        run: npm test

  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, customer, app-shared]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Flutter (stable)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Packages (Flutter's own + our local copies)
        working-directory: ${{ matrix.app }}
        run: |
          flutter --version
          flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

      - name: Tests
        if: matrix.app != 'app-shared'
        working-directory: ${{ matrix.app }}
        run: flutter test

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, customer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter (fixed version)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Release APK and App Bundle compile
        working-directory: ${{ matrix.app }}
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          ls -la build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab

  ios-release:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, customer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Flutter (fixed version)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: iPhone release build compiles (no signing)
        working-directory: ${{ matrix.app }}
        run: |
          flutter --version
          flutter pub get
          flutter build ios --release --no-codesign
          ls -d build/ios/iphoneos/Runner.app
