name: bquee
description: BQuee – queue and token app for super admins, the BQuee team, service owners and staff.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

# Self-contained: no packages downloaded from pub.dev (material_ui is our own copy). Camera, storage, sharing and the photo picker are
# the app's own Kotlin/Swift code; QR encoding/decoding is our own Dart code; fonts and icons
# are bundled below.
dependencies:
  flutter:
    sdk: flutter
  # Our own shared code (../app-shared) – used by both BQuee apps.
  bquee_shared:
    path: ../app-shared
  # Flutter's official Material widgets – our own copy in ../material_ui (no download).
  material_ui:
    path: ../material_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
